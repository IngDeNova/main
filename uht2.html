<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UTH Simulator FIXED</title>

<style>
body {
    background:#0b2e1a;
    color:white;
    font-family:Arial;
    text-align:center;
}

#table {
    margin:20px auto;
}

.cards {
    display:flex;
    justify-content:center;
    gap:10px;
    margin:10px;
}

.card {
    width:60px;
    height:80px;
    background:white;
    color:black;
    border-radius:6px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.red { color:red; }

button {
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>Ultimate Texas Hold'em (Simplified)</h1>

<div id="table">

<h3>Dealer</h3>
<div id="dealer" class="cards"></div>
<div id="dealerHand"></div>

<h3>Board</h3>
<div id="board" class="cards"></div>

<h3>Player</h3>
<div id="player" class="cards"></div>
<div id="playerHand"></div>

</div>

<div>
<button onclick="startHand()">DEAL</button>
<button onclick="nextPhase()">NEXT</button>
</div>

<h2 id="result"></h2>

<script>

// ===== DECK =====
const suits = ["♠","♣","♥","♦"];
const ranks = ["2","3","4","5","6","7","8","9","T","J","Q","K","A"];
const values = Object.fromEntries(ranks.map((r,i)=>[r,i+2]));

let deck, player, dealer, board, phase;

// ===== INIT =====
function newDeck(){
    let d=[];
    for(let s of suits){
        for(let r of ranks){
            d.push({r,s});
        }
    }
    return shuffle(d);
}

function shuffle(d){
    for(let i=d.length-1;i>0;i--){
        let j=Math.floor(Math.random()* (i+1));
        [d[i],d[j]]=[d[j],d[i]];
    }
    return d;
}

// ===== GAME FLOW =====
function startHand(){
    deck = newDeck();
    player = [deck.pop(), deck.pop()];
    dealer = [deck.pop(), deck.pop()];
    board = [];
    phase = "preflop";

    render();
    document.getElementById("result").innerText="";
}

function nextPhase(){

    if(phase==="preflop"){
        board.push(deck.pop(), deck.pop(), deck.pop());
        phase="flop";
    }
    else if(phase==="flop"){
        board.push(deck.pop());
        phase="turn";
    }
    else if(phase==="turn"){
        board.push(deck.pop());
        phase="river";
    }
    else if(phase==="river"){
        showdown();
        phase="done";
    }

    render();
}

// ===== RENDER =====
function drawCard(c, hidden=false){
    if(hidden) return `<div class="card">🂠</div>`;
    let color = (c.s==="♥"||c.s==="♦") ? "red":"";
    return `<div class="card ${color}">${c.r}<br>${c.s}</div>`;
}

function render(){

    document.getElementById("player").innerHTML =
        player.map(c=>drawCard(c)).join("");

    document.getElementById("dealer").innerHTML =
        dealer.map((c,i)=>drawCard(c, phase!=="done" && i===1)).join("");

    document.getElementById("board").innerHTML =
        board.map(c=>drawCard(c)).join("");
}

// ===== HAND EVALUATION =====
function evaluate(cards){

    let vals = cards.map(c=>values[c.r]).sort((a,b)=>b-a);

    let counts = {};
    vals.forEach(v=>counts[v]=(counts[v]||0)+1);

    let pairs = Object.values(counts).filter(v=>v===2).length;
    let trips = Object.values(counts).includes(3);
    let quads = Object.values(counts).includes(4);

    let isFlush = cards.map(c=>c.s)
        .some(s => cards.filter(c=>c.s===s).length>=5);

    let unique = [...new Set(vals)];
    let isStraight = false;

    for(let i=0;i<unique.length-4;i++){
        if(unique[i]-unique[i+4]===4){
            isStraight=true;
        }
    }

    if(isFlush && isStraight) return {rank:8,name:"Straight Flush"};
    if(quads) return {rank:7,name:"Four of a Kind"};
    if(trips && pairs) return {rank:6,name:"Full House"};
    if(isFlush) return {rank:5,name:"Flush"};
    if(isStraight) return {rank:4,name:"Straight"};
    if(trips) return {rank:3,name:"Three of a Kind"};
    if(pairs>=2) return {rank:2,name:"Two Pair"};
    if(pairs===1) return {rank:1,name:"Pair"};

    return {rank:0,name:"High Card"};
}

// ===== SHOWDOWN =====
function showdown(){

    let pEval = evaluate(player.concat(board));
    let dEval = evaluate(dealer.concat(board));

    document.getElementById("playerHand").innerText = pEval.name;
    document.getElementById("dealerHand").innerText = dEval.name;

    let result;

    if(pEval.rank > dEval.rank){
        result = "YOU WIN";
    }
    else if(pEval.rank < dEval.rank){
        result = "DEALER WINS";
    }
    else{
        result = "PUSH";
    }

    document.getElementById("result").innerText = result;

    render();
}

</script>

</body>
</html>
